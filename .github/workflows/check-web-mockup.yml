name: Check web mockup
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test_web_mockup.mjs
      - run: node tests/test_combined_benefits.mjs
      - run: node tests/test_flood_eligibility.mjs
      - run: node tests/test_combined_burdens.mjs
      - run: node tests/test_score_comparison.mjs
      - name: Check rendered map layers in Chrome
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >"$RUNNER_TEMP/map-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          url=http://127.0.0.1:8765/tests/test_tract_toggle.html
          curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-delay 1 "$url" -o /dev/null
          google-chrome --headless --disable-dev-shm-usage --host-resolver-rules="MAP * ~NOTFOUND" --virtual-time-budget=30000 --dump-dom "$url" > "$RUNNER_TEMP/map-test.html"
          grep -F '<output id="result">' "$RUNNER_TEMP/map-test.html"
          grep -Fq '<output id="result">PASS</output>' "$RUNNER_TEMP/map-test.html"
